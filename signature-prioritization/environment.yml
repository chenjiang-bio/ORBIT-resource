# Conda environment for OCSP.
#
# Use this when you need expression mode: the differential-expression step calls
# R (DESeq2 / edgeR / limma), and conda installs those in the same step as the
# Python dependencies. pip cannot install R packages, so a pip-only install
# leaves you to set R up separately.
#
#   conda env create -f environment.yml
#   conda activate orbit-ocsp
#   pip install -e .            # or: pip install orbit-ocsp
#
# Gene-list and sequence modes need no R; for those, plain pip is enough.
name: orbit-ocsp
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.9,<3.13
  # Core scientific stack
  - numpy>=1.24
  - scipy>=1.11
  - pandas>=2.0
  - requests>=2.31
  - pyyaml>=6.0
  - tqdm>=4.65
  - psutil>=5.9
  # Expression mode only: differential expression runs in R.
  - r-base>=4.2
  - bioconductor-deseq2
  - bioconductor-edger
  - bioconductor-limma
  # Optional: run the tutorial notebook.
  - jupyter
  - ipykernel
