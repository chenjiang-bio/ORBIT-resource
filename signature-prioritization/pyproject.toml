[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-ocsp"
version = "0.1.2"
description = "OCSP: context-guided signature prioritization for organoid studies"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "ORBIT team", email = "hpw@ms.xjb.ac.cn"}]
keywords = [
    "organoid", "biomarker-prioritization", "functional-enrichment",
    "gene-ontology", "kegg", "bioinformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.65.0",
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/chenjiang-bio/ORBIT-organoid-resource/tree/main/signature-prioritization"
Documentation = "https://github.com/chenjiang-bio/ORBIT-organoid-resource/tree/main/signature-prioritization#readme"
Repository = "https://github.com/chenjiang-bio/ORBIT-organoid-resource"
Issues = "https://github.com/chenjiang-bio/ORBIT-organoid-resource/issues"

[project.optional-dependencies]
notebook = ["jupyter>=1.0.0", "ipykernel>=6.0.0"]
dev = ["pytest>=7.0.0", "pytest-cov>=3.0.0"]

[project.scripts]
orbit-ocsp = "orbit_ocsp.cli:main"
orbit-ocsp-download-data = "orbit_ocsp.download_data:main"
orbit-ocsp-list-fields = "orbit_ocsp.list_b_fields:main"

[tool.setuptools]
packages = ["orbit_ocsp"]

# run_de.R must travel with the package: expression mode shells out to it, and
# files outside the package directory are not installed by pip.
[tool.setuptools.package-data]
orbit_ocsp = ["R/*.R"]

[tool.pytest.ini_options]
testpaths = ["tests"]
