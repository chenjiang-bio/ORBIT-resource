correct_task:
  description: >
    **PRIMARY DATA**
      <KNOWLEDGE>{knowledge}</KNOWLEDGE>
      <ORIGINAL_TEXT>{original_text}</ORIGINAL_TEXT>
      <EXTRACTED_DATA>{extracted_data}</EXTRACTED_DATA>
      <EXTRACTED_DATA_DESCRIPTION>{extracted_data_description}</EXTRACTED_DATA_DESCRIPTION>
      <CHECKED_WITH_SEARCHED_DATA>{checked_data}</CHECKED_WITH_SEARCHED_DATA>
      <CHECKED_WITH_SEARCHED_DATA_DESCRIPTION>{checked_data_description}</CHECKED_WITH_SEARCHED_DATA_DESCRIPTION>

    **HTML TAGS DESC**
    (Note: Backtick `TAG` below refers to content wrapped in <TAG>...</TAG> XML-style tags in PRIMARY DATA section)
    1. `KNOWLEDGE` (from <KNOWLEDGE>...</KNOWLEDGE>): Domain knowledge and global rules. Final Answer MUST comply with all rules.
    
    2. `ORIGINAL_TEXT` (from <ORIGINAL_TEXT>...</ORIGINAL_TEXT>): The SOLE authoritative source - EXCLUSIVELY content within these XML tags. Ultimate truth when validating suggestions. If suggestion claims "original text states X" but <ORIGINAL_TEXT> contains Y, the suggestion is WRONG.
    
    3. `EXTRACTED_DATA` (from <EXTRACTED_DATA>...</EXTRACTED_DATA>): Initial extraction output needing correction. Starting point - modify based on valid suggestions from CHECKED_WITH_SEARCHED_DATA.
    
    4. `EXTRACTED_DATA_DESCRIPTION` (from <EXTRACTED_DATA_DESCRIPTION>...</EXTRACTED_DATA_DESCRIPTION>): Schema documentation for ExtractionResult. Corrected output MUST follow this schema.
    
    5. `CHECKED_WITH_SEARCHED_DATA` (from <CHECKED_WITH_SEARCHED_DATA>...</CHECKED_WITH_SEARCHED_DATA>): Combined checker errors (with error_path, error_reason, suggestion, who) and searcher results. Validate each suggestion against ORIGINAL_TEXT, then apply ONLY valid ones. Multiple checkers may contradict - detect conflicts and choose correctly.
    
    6. `CHECKED_WITH_SEARCHED_DATA_DESCRIPTION` (from <CHECKED_WITH_SEARCHED_DATA_DESCRIPTION>...</CHECKED_WITH_SEARCHED_DATA_DESCRIPTION>): Schema for DataSearchCheckResult. Note: search results are context only, not corrections to apply.

    **TASK**
    1. Review suggestions in `CHECKED_WITH_SEARCHED_DATA` (contains error_path, error_reason, suggestion, who fields from multiple checkers).
    2. When multiple checkers give conflicting suggestions for the same field, verify against `ORIGINAL_TEXT` to choose the correct one.
    3. Based on the suggestions after review, the contents of the EXTRACTED_DATA are revised and output as final Answer.
    4. Ensure final Answer strictly follows `ORIGINAL_TEXT` and complies with all rules in `KNOWLEDGE`.
    5. If when obtaining a certain piece of information, no detailed information is found at the corresponding location in the ORIGINAL_TEXT, but only 'refer to the attachment' or 'refer to other references' are found nearby, then directly output 'this information from xxxxxxxx (attachment x or DOI of the reference)' based on the full text content.
    6. The Correct DOI SHOUD BE in results of `CHECKED_WITH_SEARCHED_DATA.search.searchings`, if it is missing in EXTRACTED_DATA, you NEED to add it to final Answer.

    **CRITICAL**: Final Answer MUST comply with ALL rules defined in KNOWLEDGE (same rules as extract_task):
    - RULE 20: GLOBAL EXTRACTION RULES (ONE entity per item, Nomenclature, Units, Source preservation, Multiple protocols)
    - RULE 2: TYPE AND VALUE OF FIELD (Required vs Optional fields, token-efficient handling)
    - Time Axis System: time_anchors (milestone/intervention/observation), time_axis (Main/Branch), TimeAxisSegmentInfo structure
    - CULTURE MATERIAL CLASSIFICATION & DUAL RECORDING RULES (Medium decomposition, dual recording in steps and material_source)
    - Tag rules (RULE 3/4/5: [❓️][💡][🔎]), Co-culture rules (RULE 12/13/18), Biomarkers (RULE 14), etc.
    - MUST NOT USE ANY TOOLS in Correct Task! MUST NOT USE ANY TOOLS in Correct Task! MUST NOT USE ANY TOOLS in Correct Task!

    <LAST OUTPUT>
    {last_output}
    </LAST OUTPUT>

    <LAST ERROR>
    {last_error}
    </LAST ERROR>

judge_task:
  description: >
    **PRIMARY DATA**
      <KNOWLEDGE>{knowledge}</KNOWLEDGE>
      <ORIGINAL_TEXT>{original_text}</ORIGINAL_TEXT>
      <WAIT_FOR_SCORES>{waiting_for_scores}</WAIT_FOR_SCORES>
      <EXTRACTED_DATA_DESCRIPTION>{extracted_data_description}</EXTRACTED_DATA_DESCRIPTION>
      <CHECKED_WITH_SEARCHED_DATA>{checked_data}</CHECKED_WITH_SEARCHED_DATA>
      <CHECKED_WITH_SEARCHED_DATA_DESCRIPTION>{checked_data_description}</CHECKED_WITH_SEARCHED_DATA_DESCRIPTION>
    
    **HTML TAGS DESC**
    (Note: Backtick `TAG` below refers to content wrapped in <TAG>...</TAG> XML-style tags in PRIMARY DATA section)
    1. `KNOWLEDGE` (from <KNOWLEDGE>...</KNOWLEDGE>): Domain knowledge and global rules. Use to identify correct vs incorrect extraction for scoring.
    
    2. `ORIGINAL_TEXT` (from <ORIGINAL_TEXT>...</ORIGINAL_TEXT>): The SOLE authoritative source - EXCLUSIVELY content within these XML tags. Judge accuracy by comparing WAIT_FOR_SCORES against what actually appears here, not external knowledge.
    
